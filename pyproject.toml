[project]
name = "thesis-dashboard"
version = "0.1.0"
description = "Local replay/debugging dashboard for the RL auction agent (reads recorded runs written by urban-mobility-simulation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.17",
    "plotly>=5.24",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "h3>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
